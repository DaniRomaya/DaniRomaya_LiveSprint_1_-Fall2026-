<html lang="en">
  <head>

    <title>LiveSprint</title>
    <link rel="stylesheet" href="style.css" />
  </head>

    <section class="main-container">

        <h1 class="page-title">

        </p>

      <div id="animal-container" class="animal-container"></div>

          <button id="reveal-cat" class="btn btn-outline">Reveal Cat</button>
